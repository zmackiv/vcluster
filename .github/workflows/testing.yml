name: Testing Workflow

on: 
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit"
        type: string
        # default:

jobs:
  manual:
    runs-on: ubuntu-latest

    steps:
      - name: Inputed commit name
        run: echo "${{ inputs.commit }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          
      - name: Git log
        run: git log
          
